# pnpm-style symlinked node_modules — no phantom dependencies
[install]
linker = "isolated"

# bun add saves exact versions, no ^/~ ranges
exact = true

# supply-chain guard: only install versions published >= 7 days ago
minimumReleaseAge = 604800

# @zgeoff/imp-client and @zgeoff/oxlint-config, first-party packages, are pinned
# to releases younger than the gate; each pinned version's provenance and
# registry signatures are checked before the pin, and their own dependencies
# stay behind the gate.
minimumReleaseAgeExcludes = ["@zgeoff/imp-client", "@zgeoff/oxlint-config"]

[test]
# the atc-bridge mod's tests run on Claude Code's engine through
# `bun run test:atc-bridge`, never under bun test
pathIgnorePatterns = ["mods/**"]

# isolates every test run from the real home and runtime directories, seeds
# faker once, then registers jest-extended matchers for `bun test`
preload = [
  "./packages/app/src/test-utils/isolate-home.ts",
  "./packages/app/src/test-utils/seed-faker.ts",
  "@zgeoff/bun-test-extended",
]
