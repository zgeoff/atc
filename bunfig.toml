# pnpm-style symlinked node_modules — no phantom dependencies
[install]
linker = "isolated"

# bun add saves exact versions, no ^/~ ranges
exact = true

# supply-chain guard: only install versions published >= 7 days ago
minimumReleaseAge = 604800

# first-party packages skip the gate; their third-party dependencies stay
# behind it. Renovate bumps @zgeoff packages as soon as they publish, so each
# one atc installs, directly or through another first-party package, needs an
# entry here, or bun install refuses the bump.
# @maschwenk/tsrslint 0.1.6 (published 2026-10-26) ages past the gate ~2026-11-02 — remove then
# @maschwenk/tsrslint-linux-x64 0.1.6 (published 2026-10-26) ages past the gate ~2026-11-02 — remove then
# @maschwenk/tsrslint-linux-arm64 0.1.6 (published 2026-10-26) ages past the gate ~2026-11-02 — remove then
# @maschwenk/tsrslint-darwin-arm64 0.1.6 (published 2026-10-26) ages past the gate ~2026-11-02 — remove then
minimumReleaseAgeExcludes = [
  "@impz/client",
  "@maschwenk/tsrslint",
  "@maschwenk/tsrslint-darwin-arm64",
  "@maschwenk/tsrslint-linux-arm64",
  "@maschwenk/tsrslint-linux-x64",
  "@zgeoff/bun-test-extended",
  "@zgeoff/format-codemod",
  "@zgeoff/kysely-bun-sqlite",
  "@zgeoff/oxlint-config",
  "@zgeoff/skill-gate",
  "@zgeoff/std",
]

[test]
# the atc-bridge mod's tests run on Claude Code's engine through
# `bun run test:atc-bridge`, never under bun test, a `.codex.test.ts` suite
# runs the installed Codex CLI only in `bun run test:codex`, and an `e2e/`
# suite runs only in `bun run test:e2e` under the e2e lane limit; each lane
# script replaces this list with one that keeps `mods/**`
pathIgnorePatterns = ["mods/**", "**/*.codex.test.ts", "e2e/**"]

# isolates every test run from the real home and runtime directories, seeds
# faker once, then registers jest-extended matchers for `bun test`
preload = [
  "./packages/test-utils/src/isolate-home.ts",
  "./packages/test-utils/src/seed-faker.ts",
  "./packages/mcp/src/testing/load-web-authn-early.ts",
  "@zgeoff/bun-test-extended",
]
