# pnpm-style symlinked node_modules — no phantom dependencies
[install]
linker = "isolated"

# bun add saves exact versions, no ^/~ ranges
exact = true

# supply-chain guard: only install versions published >= 7 days ago
minimumReleaseAge = 604800

# @zgeoff/imp-client, a first-party package, is pinned to a release younger than
# the gate; each pinned version's provenance and registry signatures are checked
# before the pin, and its own dependencies stay behind the gate.
minimumReleaseAgeExcludes = ["@zgeoff/imp-client"]

[test]
# isolates every test run from the real home and runtime directories, then
# registers jest-extended matchers for `bun test`
preload = ["./src/test-utils/isolate-home.ts", "@zgeoff/bun-test-extended"]
