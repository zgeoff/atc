# pnpm-style symlinked node_modules — no phantom dependencies
[install]
linker = "isolated"

# bun add saves exact versions, no ^/~ ranges
exact = true

# supply-chain guard: only install versions published >= 7 days ago
minimumReleaseAge = 604800

# qs 6.16.0 fixes GHSA-x5fp-wj9c-mxmx and GHSA-4mjr-xmp4-gh2g and is younger than the gate.
# @zgeoff/imp-client is pinned to a release younger than the gate; each pinned
# version's provenance and registry signatures are checked before the pin, and its
# own dependencies stay behind the gate.
minimumReleaseAgeExcludes = ["qs", "@zgeoff/imp-client"]

[test]
# isolates every test run from the real home and runtime directories, then
# registers jest-extended matchers for `bun test`
preload = ["./test/isolate-home.ts", "@zgeoff/bun-test-extended"]
