# pnpm-style symlinked node_modules — no phantom dependencies
[install]
linker = "isolated"

# bun add saves exact versions, no ^/~ ranges
exact = true

# supply-chain guard: only install versions published >= 7 days ago
minimumReleaseAge = 604800

# first-party packages skip the gate; their third-party dependencies stay
# behind it. Renovate bumps @zgeoff packages as soon as they publish, so each
# one atc installs, directly or through another first-party package, needs an
# entry here, or bun install refuses the bump.
minimumReleaseAgeExcludes = [
  "@impz/client",
  "@zgeoff/bun-test-extended",
  "@zgeoff/format-codemod",
  "@zgeoff/kysely-bun-sqlite",
  "@zgeoff/oxlint-config",
  "@zgeoff/skill-gate",
  "@zgeoff/std",
]

[test]
# the atc-bridge mod's tests run on Claude Code's engine through
# `bun run test:atc-bridge`, never under bun test
pathIgnorePatterns = ["mods/**"]

# isolates every test run from the real home and runtime directories, seeds
# faker once, then registers jest-extended matchers for `bun test`
preload = [
  "./packages/test-utils/src/isolate-home.ts",
  "./packages/test-utils/src/seed-faker.ts",
  "@zgeoff/bun-test-extended",
]
