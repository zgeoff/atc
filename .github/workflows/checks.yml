name: Checks

# The static checks with the bridge tests, and the test suite run once inside
# a canary home, shared by the PR and main workflows; each caller's own checks
# job gates on this one.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    # a hung step (a script that never exits, a wedged process) must fail the
    # run, not burn runner hours
    timeout-minutes: 10
    env:
      # CI never commits, but skip hook install/execution regardless
      LEFTHOOK: 0
      # the mods API is early access and changes between Claude Code releases,
      # so the mod is validated and tested against one exact build
      CLAUDE_CODE_VERSION: 2.1.294
      # the App Server API is experimental and changes between Codex releases,
      # so the bridge is tested against one exact build, and the tests report a
      # different installed one
      CODEX_VERSION: 0.163.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # the npm installs below run package scripts, which need no git token
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Audit Dependencies
        run: bun run audit

      - name: Dead Code
        run: bun run deadcode

      - name: Import Direction
        run: bun run check:imports

      - name: Package Manifests
        run: bun run check:manifests

      - name: Gateway Reach
        run: bun run check:reach

      - name: Provider Bundle
        run: bun run check:bundle

      - name: Contract Declarations
        run: bun run check:contract

      # packs @atcx/contract as the release publishes it, installs the tarball
      # into a Node project that imports it and type-checks against it, and
      # runs npm's publish as a dry run
      - name: Contract Package
        run: bash scripts/publish-contract.sh --dry-run

      - name: Import Rule Disables
        run: bun run check:disable-baseline

      - name: Raw Escape Bytes
        run: bun run check:raw-escapes

      - name: Test Helper Source Entries
        run: bun run check:source-entries

      - name: Format
        run: bun run format:check

      # shfmt and shellcheck are pinned with their published hashes, so what
      # this step checks does not move with the runner image
      - name: Install shfmt and shellcheck
        env:
          SHFMT_VERSION: v3.13.1
          SHFMT_SHA256: fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
        run: |
          bin="$RUNNER_TEMP/shell-tools"
          mkdir -p "$bin"
          curl -fsSL -o "$bin/shfmt" \
            "https://github.com/mvdan/sh/releases/download/$SHFMT_VERSION/shfmt_${SHFMT_VERSION}_linux_amd64"
          echo "$SHFMT_SHA256  $bin/shfmt" | sha256sum -c -
          chmod +x "$bin/shfmt"
          archive="shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$archive"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION/shellcheck" "$bin/shellcheck"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Shell Lint
        run: bun run lint:shell

      - name: Guest Shell Scripts
        run: bun run check:guest-scripts

      - name: Lint
        run: bun run lint:full

      - name: Lint mods
        run: bun run lint:mods

      - name: Doc links
        run: bash .claude/skills/docs-writing/scripts/check-links.sh

      # The root package is private, but its README is the product README, so it is checked
      # against the package limits.
      - name: Doc length and prose
        run: bash .claude/skills/docs-writing/scripts/check-length.sh --package README.md

      - name: Typecheck
        run: bun run typecheck

      # the two bridges run here, not in jobs of their own, because each takes
      # seconds and a job of its own costs a runner start and an install
      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Check Embedded Mod Drift
        run: |
          bun run build:atc-bridge
          git diff --exit-code packages/harnesses/claude/src/bridge/atc-bridge-files.ts

      - name: Test Mod
        run: bun run test:atc-bridge

      - name: Install Codex
        run: |
          npm install --global "@openai/codex@${CODEX_VERSION}"
          codex --version

      - name: Test Codex Bridge
        run: bun run test:codex

  # the suite runs once, inside a home of canary files, and fails when a test
  # reads, changes, or adds to a home it does not own
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEFTHOOK: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      # the embedded shell tests run shellcheck and fail without it
      - name: Install shellcheck
        run: command -v shellcheck || { sudo apt-get update && sudo apt-get install -y shellcheck; }

      # the tests' temp files go on tmpfs: on the runner's disk, a writeback
      # of the pages that checkout and install dirtied stalls every test that
      # writes a file or fsyncs for seconds, past the test timeout
      - name: Test
        env:
          TMPDIR: /dev/shm
        run:
          bun run test:isolation bun run test --randomize --reporter=junit
          --reporter-outfile="$RUNNER_TEMP/test-times.xml"

      # the e2e lane, on the suites the binaries workflow does not run against
      # a compiled binary; the unit run above leaves e2e/ out
      - name: Test e2e
        if: ${{ !cancelled() }}
        env:
          TMPDIR: /dev/shm
        run: |
          mapfile -t suites < <(find e2e -maxdepth 1 -name '*.test.ts' ! -name 'daemon-*' ! -name 'gateway-*' | sort)
          bun run test:isolation bun run test:e2e --parallel=4 --no-isolate --randomize --reporter=junit \
            --reporter-outfile="$RUNNER_TEMP/test-times-e2e.xml" "${suites[@]}"

      # the per-test times of each run on main, which the weekly audit reads
      - name: Upload test times
        if: github.event_name == 'push' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-times
          path: |
            ${{ runner.temp }}/test-times.xml
            ${{ runner.temp }}/test-times-e2e.xml
          if-no-files-found: error
