name: Binaries

# Compiles the per-platform atc binaries and proves each one on its own
# platform. The PR workflow calls this as a check; the main workflow calls it
# to produce the assets it attaches to a release.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEFTHOOK: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      # Every target cross-compiles from this one runner; the smoke job below
      # is where each binary meets its own platform.
      - name: Build binaries
        run: bun run build:binaries

      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The daemon suite spawns real PTYs through the binary under test, so a
  # native library that fails to load inside the compiled binary fails here
  # rather than on a user's machine.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      LEFTHOOK: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist

      - name: Smoke test the compiled binary
        env:
          ATC_BIN: ${{ github.workspace }}/dist/atc-${{ matrix.target }}
        run: |
          chmod +x "$ATC_BIN"
          now() { perl -MTime::HiRes=time -e 'printf "%.0f", time*1000'; }
          for i in 1 2 3; do s=$(now); "$ATC_BIN" --version >/dev/null; echo "PROBE version run $i $(( $(now) - s ))ms"; done
          for i in 1 2; do s=$(now); bun -e 1; echo "PROBE bun -e run $i $(( $(now) - s ))ms"; done
          if [ "$RUNNER_OS" = macOS ]; then codesign -dv "$ATC_BIN" 2>&1 | sed 's/^/PROBE codesign /' || true; fi
          for i in 1 2; do s=$(now); (cd packages/execution/local && bun -e "const {spawn}=require('bun-pty'); const p=spawn('/bin/echo',['hi'],{name:'xterm',cols:80,rows:24,cwd:'/',env:{}}); p.onExit(()=>process.exit(0))"); echo "PROBE node_modules pty run $i $(( $(now) - s ))ms"; done
          for i in 1 2; do bun run test:e2e e2e/daemon-terminal.test.ts -t 'it attaches a client at the size' 2>&1 | grep -E 'PROBE|\((pass|fail)\)'; done
          bun run test:e2e e2e/daemon-*.test.ts

      # The checks workflow runs the provider tests on Linux alone, and these
      # are the only macOS runners CI starts.
      - name: Test the local PTY provider
        if: runner.os == 'macOS'
        run: bun run test packages/execution/local/src/create-local-pty-provider.test.ts

      # The gateway ships for linux-x64 alone.
      - name: Smoke test the compiled gateway
        if: matrix.target == 'linux-x64'
        env:
          ATC_GATEWAY_BIN: ${{ github.workspace }}/dist/atc-gateway-linux-x64
        run: |
          chmod +x "$ATC_GATEWAY_BIN"
          "$ATC_GATEWAY_BIN" --version
          bun run test:e2e e2e/gateway-*.test.ts
