name: Dependency Health

on:
  schedule:
    # Monday 06:00 UTC, alongside the repo-sync cron
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Audit
        run: bun run audit

      # informational: the log shows what has newer versions; upgrades are
      # deliberate PRs, never automatic
      - name: Outdated
        run: bun outdated || true
