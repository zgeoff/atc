name: PR

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # the action comments findings on the PR, which needs write on pull-requests
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the action's hard-coded default (8.24.3) predates the root-level
          # [[allowlists]] syntax .gitleaks.toml relies on and silently ignores it
          GITLEAKS_VERSION: 8.30.1

  binaries:
    uses: ./.github/workflows/binaries.yml

  checks:
    runs-on: ubuntu-latest
    # a hung step (a script that never exits, a wedged process) must fail the
    # run, not burn runner hours
    timeout-minutes: 10
    env:
      # CI never commits, but skip hook install/execution regardless
      LEFTHOOK: 0
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Audit Dependencies
        run: bun run audit

      - name: Check AGENTS.md Drift
        run: |
          bun run build:agents
          git diff --exit-code AGENTS.md agents/ scripts/build-agents-md.sh

      - name: Dead Code
        run: bun run deadcode

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
