name: PR

on:
  pull_request:

permissions:
  actions: read
  contents: read

# a newer push to the branch makes this run's result worthless
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # the action comments findings on the PR, which needs write on pull-requests
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # gitleaks reads every commit's patch, so the clone takes the blobs at once
        with:
          fetch-depth: 0
          filter: ''

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the action's hard-coded default (8.24.3) predates the root-level
          # [[allowlists]] syntax .gitleaks.toml relies on and silently ignores it
          GITLEAKS_VERSION: 8.30.1

  binaries:
    uses: ./.github/workflows/binaries.yml

  ci:
    uses: ./.github/workflows/checks.yml

  # the one status the main ruleset requires: it runs even when a job it needs
  # failed or was skipped, and passes only when every one of them succeeded
  checks:
    needs: [ci, binaries]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Require every check
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: bun run --silent ci:require-every-check
