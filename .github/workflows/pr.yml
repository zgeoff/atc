name: PR

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # the action comments findings on the PR, which needs write on pull-requests
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the action's hard-coded default (8.24.3) predates the root-level
          # [[allowlists]] syntax .gitleaks.toml relies on and silently ignores it
          GITLEAKS_VERSION: 8.30.1

  binaries:
    uses: ./.github/workflows/binaries.yml

  ci:
    uses: ./.github/workflows/checks.yml

  # the one status the main ruleset requires: it runs even when a job it needs
  # failed or was skipped, and passes only when every one of them succeeded
  checks:
    needs: [ci, binaries, atc-bridge]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "a required job ended as $result" >&2
              exit 1
            fi
          done

  atc-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEFTHOOK: 0
      # the mods API is early access and changes between Claude Code releases,
      # so the mod is validated and tested against one exact build
      CLAUDE_CODE_VERSION: 2.1.287
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Check Embedded Mod Drift
        run: |
          bun run build:atc-bridge
          git diff --exit-code packages/harnesses/claude/src/bridge/atc-bridge-files.ts

      - name: Test Mod
        run: bun run test:atc-bridge
