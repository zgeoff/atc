name: PR Title

# A squash merge makes the PR title the commit subject, so the title passes the
# same commitlint rules a commit message does. This runs apart from the PR
# workflow because a title edit fires `edited`, and the whole suite should not
# rerun on every title or body edit.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LEFTHOOK: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      # the title reaches the shell through the environment, never through
      # expression interpolation, so a crafted title cannot inject a command
      - name: Lint Title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | node_modules/.bin/commitlint --verbose
