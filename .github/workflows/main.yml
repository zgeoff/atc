name: Main

on:
  push:
    branches: [main]
  # Recovery path for a release that tagged but failed to ship: skips the
  # release-please steps and re-runs only the steps that ship the current
  # version. Each of them replaces what a failed run left, so re-running is safe.
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: main-checks
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/checks.yml

  # the one status the main ruleset requires: it runs even when a job it needs
  # failed or was skipped, and passes only when every one of them succeeded
  checks:
    needs: [ci]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "a required job ended as $result" >&2
              exit 1
            fi
          done

  binaries:
    uses: ./.github/workflows/binaries.yml

  release:
    needs: [checks, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # bun install's prepare script installs git hooks that re-run the
      # checks job's commands and would reject this job's bot pushes.
      LEFTHOOK: '0'
    steps:
      # A release takes two runs of this job:
      # - Run 1, after a releasable commit lands on main: release-please
      #   opens or updates the release PR (version bump + changelog), and
      #   the sync step makes that PR pass the checks job. The PR then
      #   waits for someone to merge it by hand; no step here merges it.
      # - Run 2, triggered by that merge: release-please turns the merged
      #   bump into a tag + GitHub release, and the steps after it attach the
      #   binaries and update the Homebrew formula.
      #
      # The App token exists because GITHUB_TOKEN events don't trigger
      # workflows: a release PR that GITHUB_TOKEN opens or pushes to gets
      # no pull request checks. With no App configured (see
      # docs/runbooks/releasing.md), the release PR still opens, without
      # those checks.
      - name: Mint GitHub App token
        id: app-token
        if: github.event_name == 'push' && vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      # The release PR bumps the package.json version that bun.lock also
      # records, and generates files oxfmt wouldn't accept — repair both so
      # the PR passes the same checks as any other. The branch name is
      # deterministic: single manifest package with a component, so
      # release-please appends the component to its usual branch.
      - name: Check out release PR
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release-please--branches--main--components--@zgeoff/atc
          token: ${{ steps.app-token.outputs.token || github.token }}
      - name: Set up bun
        if: steps.release.outputs.prs_created == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Sync lockfile and formatting on release PR
        if: steps.release.outputs.prs_created == 'true'
        run: |
          bun install
          bun run format
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: sync lockfile and format release files"
            git push
          fi

      - name: Check out merged release
        if:
          steps.release.outputs.releases_created == 'true' || github.event_name ==
          'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download binaries
        if:
          steps.release.outputs.releases_created == 'true' || github.event_name ==
          'workflow_dispatch'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      # --clobber makes a re-run replace assets a failed run left behind.
      - name: Attach binaries to the release
        if:
          steps.release.outputs.releases_created == 'true' || github.event_name ==
          'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version package.json)
          gh release upload "@zgeoff/atc@$version" dist/atc-* dist/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

      # The tap is a second repository, so the release App has to be
      # installed on it as well and HOMEBREW_TAP set to its name (see
      # docs/runbooks/releasing.md). With either missing, the formula is left alone.
      - name: Mint tap token
        id: tap-token
        if:
          (steps.release.outputs.releases_created == 'true' || github.event_name ==
          'workflow_dispatch') && vars.RELEASE_APP_ID != '' && vars.HOMEBREW_TAP != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.HOMEBREW_TAP }}
      - name: Update the Homebrew formula
        if: steps.tap-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          TAP: ${{ github.repository_owner }}/${{ vars.HOMEBREW_TAP }}
        run: |
          version=$(jq -r .version package.json)
          git clone "https://x-access-token:$GH_TOKEN@github.com/$TAP.git" tap
          mkdir -p tap/Formula
          scripts/build-formula.sh "$version" dist/SHA256SUMS > tap/Formula/atc.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/atc.rb
          git commit -m "atc $version" || echo "formula already at $version"
          git push
