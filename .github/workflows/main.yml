name: Main

on:
  push:
    branches: [main, release/7.3.x]
  # Recovery path for a release that tagged but failed to ship: skips the
  # release-please steps and re-runs only the steps that ship the current
  # version. Each of them replaces what a failed run left, so re-running is safe.
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# A newer push makes this run's checks worthless, so ci, binaries and checks
# each cancel their older run through a job-level group. The release job never
# cancels: a release cut off mid-way can leave a tag without its binaries or
# formula. A workflow-level group would reach the release job too, so every
# group here is set per job.
jobs:
  ci:
    concurrency:
      group: main-ci-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/checks.yml

  # the one status the main ruleset requires: it runs even when a job it needs
  # failed or was skipped, and passes only when every one of them succeeded
  #
  # A ci job that a newer push cancelled skips this job instead of failing it,
  # and the release job skips with it.
  checks:
    needs: [ci]
    if: ${{ !cancelled() && !contains(needs.*.result, 'cancelled') }}
    concurrency:
      group: main-checks-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "a required job ended as $result" >&2
              exit 1
            fi
          done

  binaries:
    concurrency:
      group: main-binaries-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/binaries.yml

  # A newer run's release waits for this one to end. GitHub keeps one pending
  # run per group, so a third run replaces a waiting one, never a running one.
  # Every branch shares the group, since each release pushes to the one tap.
  release:
    needs: [checks, binaries]
    concurrency:
      group: main-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      # bun install's prepare script installs git hooks that re-run the
      # checks job's commands and would reject this job's bot pushes.
      LEFTHOOK: '0'
    steps:
      # A release takes two runs of this job:
      # - Run 1, after a releasable commit lands on the branch: release-please
      #   opens or updates the release PR (version bump + changelog), and
      #   the sync step makes that PR pass the checks job. The PR then
      #   waits for someone to merge it by hand; no step here merges it.
      # - Run 2, triggered by that merge: release-please turns the merged
      #   bump into a tag + GitHub release, and the steps after it attach the
      #   binaries and update the Homebrew formula.
      #
      # The App token exists because GITHUB_TOKEN events don't trigger
      # workflows: a release PR that GITHUB_TOKEN opens or pushes to gets
      # no pull request checks. With no App configured (see
      # docs/runbooks/releasing.md), the release PR still opens, without
      # those checks.
      - name: Mint GitHub App token
        id: app-token
        if: github.event_name == 'push' && vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          target-branch: ${{ github.ref_name }}

      # The release PR bumps the package.json version that bun.lock also
      # records, and generates files oxfmt wouldn't accept — repair both so
      # the PR passes the same checks as any other. The branch name is
      # deterministic: single manifest package with a component, so
      # release-please appends the component to its usual branch.
      - name: Check out release PR
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release-please--branches--${{ github.ref_name }}--components--@zgeoff/atc
          token: ${{ steps.app-token.outputs.token || github.token }}
      - name: Set up bun
        if: steps.release.outputs.prs_created == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Sync lockfile and formatting on release PR
        if: steps.release.outputs.prs_created == 'true'
        run: |
          bun install
          bun run format
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: sync lockfile and format release files"
            git push
          fi

      - name: Check out merged release
        if:
          steps.release.outputs.releases_created == 'true' || github.event_name ==
          'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download binaries
        if:
          steps.release.outputs.releases_created == 'true' || github.event_name ==
          'workflow_dispatch'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      # --clobber makes a re-run replace assets a failed run left behind.
      - name: Attach binaries to the release
        if:
          steps.release.outputs.releases_created == 'true' || github.event_name ==
          'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version package.json)
          gh release upload "@zgeoff/atc@$version" dist/atc-* dist/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

      # GitHub marks each new release as latest, and install.sh downloads the
      # latest one, so a patch release from a release branch hands the mark
      # back to the newest version.
      - name: Keep the newest release as latest
        if:
          steps.release.outputs.releases_created == 'true' || github.event_name ==
          'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version package.json)
          newest=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName' | sed -n 's/^@zgeoff\/atc@//p' | sort -V | tail -n 1)
          if [ -n "$newest" ] && [ "$newest" != "$version" ]; then
            gh release edit "@zgeoff/atc@$newest" --latest --repo "$GITHUB_REPOSITORY"
          fi

      # The tap is a second repository, so the release App has to be
      # installed on it as well and HOMEBREW_TAP set to its name (see
      # docs/runbooks/releasing.md). With either missing, the formula is left alone.
      - name: Mint tap token
        id: tap-token
        if:
          (steps.release.outputs.releases_created == 'true' || github.event_name ==
          'workflow_dispatch') && vars.RELEASE_APP_ID != '' && vars.HOMEBREW_TAP != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.HOMEBREW_TAP }}
      - name: Update the Homebrew formula
        if: steps.tap-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          TAP: ${{ github.repository_owner }}/${{ vars.HOMEBREW_TAP }}
        run: |
          version=$(jq -r .version package.json)
          git clone "https://x-access-token:$GH_TOKEN@github.com/$TAP.git" tap
          # a patch release from a release branch never moves the formula back
          current=$(sed -n 's/^[[:space:]]*version "\([^"]*\)"$/\1/p' tap/Formula/atc.rb 2>/dev/null || true)
          newest=$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n 1)
          if [ -n "$current" ] && [ "$newest" != "$version" ]; then
            echo "formula holds $current, newer than $version; left as it is"
            exit 0
          fi
          mkdir -p tap/Formula
          scripts/build-formula.sh "$version" dist/SHA256SUMS > tap/Formula/atc.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/atc.rb
          git commit -m "atc $version" || echo "formula already at $version"
          git push
