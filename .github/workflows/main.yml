name: Main

on:
  push:
    branches: [main]
  # Ships the version of the commit it runs on: the recovery path for a release
  # that tagged but failed to ship, and the run that dispatch-release starts
  # at a tag. It skips the release job. Each ship step replaces what a failed
  # run left, so re-running is safe.
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# A newer push makes this run's checks worthless, so ci, binaries and checks
# each cancel their older run through a job-level group. The release jobs never
# cancel: a release cut off mid-way can leave a tag without its binaries or
# formula. A workflow-level group would reach the release jobs too, so every
# group here is set per job. The groups of ci, binaries and checks hold the
# run's ref, so a push to main never cancels a run dispatched at a tag.
jobs:
  ci:
    concurrency:
      group: main-ci-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/checks.yml

  # the one status the main ruleset requires: it runs even when a job it needs
  # failed or was skipped, and passes only when every one of them succeeded
  #
  # A ci job that a newer push cancelled skips this job instead of failing it,
  # and the ship-release job skips with it.
  checks:
    needs: [ci]
    if: ${{ !cancelled() && !contains(needs.*.result, 'cancelled') }}
    concurrency:
      group: main-checks-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "a required job ended as $result" >&2
              exit 1
            fi
          done

  binaries:
    concurrency:
      group: main-binaries-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/binaries.yml

  # A release takes two runs of the release job, through the shared
  # release-please job in zgeoff/tools (docs/runbooks/releasing.md):
  # - after a releasable commit lands on main, release-please opens or updates
  #   the release PR (version bump and changelog), and the shared job's sync
  #   command makes that PR pass the checks job. The PR then waits for someone
  #   to merge it by hand, so merge stays off.
  # - the run of that merge's push tags the release, and the ship-release job
  #   attaches the binaries, updates the Homebrew formula and publishes
  #   @atcx/contract.
  #
  # The release job waits for no checks: the release PR passed its own, and
  # the tag must land while the merge commit is still main's head, as the
  # release App's token cannot tag a commit behind a workflow change. With no
  # App configured, the release PR still opens, without checks.
  release:
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    uses: zgeoff/tools/.github/workflows/release-please.yml@sync-v29
    with:
      app-id: ${{ vars.RELEASE_APP_ID }}
      merge: false
      # release-please names the branch for the root package's component
      release-branch: release-please--branches--main--components--@zgeoff/atc
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # Picks whether this run ships a release, dispatches a run at its tag, or
  # ships nothing. It runs after a failed or skipped need too, since a tag
  # whose checks a newer push cancelled still needs its dispatch.
  pick-release-ship:
    needs: [checks, binaries, release]
    if: ${{ !cancelled() }}
    concurrency:
      group: main-pick-release-ship
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ship: ${{ steps.pick.outputs.ship }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Pick the release ship
        id: pick
        env:
          RELEASES_CREATED: ${{ needs.release.outputs.releases_created }}
          RELEASE_OUTPUTS: ${{ needs.release.outputs.release-outputs }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          BINARIES_RESULT: ${{ needs.binaries.result }}
        run: bun run --silent ci:pick-release-ship

  # A newer run's ship waits for this one to end, and queue: max keeps every
  # waiting run, where the default would replace a waiting one.
  ship-release:
    needs: [pick-release-ship]
    if: ${{ !cancelled() && needs.pick-release-ship.outputs.ship == 'here' }}
    concurrency:
      group: main-release
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # npm's trusted publishing of @atcx/contract takes the job's OIDC token,
      # so no npm token exists anywhere in this repository
      id-token: write
    steps:
      - name: Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      # --clobber makes a re-run replace assets a failed run left behind.
      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version package.json)
          gh release upload "@zgeoff/atc@$version" dist/atc-* dist/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

      # The tap is a second repository, so the release App has to be
      # installed on it as well and HOMEBREW_TAP set to its name (see
      # docs/runbooks/releasing.md). With either missing, the formula is left alone.
      - name: Mint tap token
        id: tap-token
        if: vars.RELEASE_APP_ID != '' && vars.HOMEBREW_TAP != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.HOMEBREW_TAP }}
      - name: Update the Homebrew formula
        if: steps.tap-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          TAP: ${{ github.repository_owner }}/${{ vars.HOMEBREW_TAP }}
        run: |
          version=$(jq -r .version package.json)
          git clone "https://x-access-token:$GH_TOKEN@github.com/$TAP.git" tap
          mkdir -p tap/Formula
          scripts/build-formula.sh "$version" dist/SHA256SUMS > tap/Formula/atc.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/atc.rb
          git commit -m "atc $version" || echo "formula already at $version"
          git push

      - name: Set up bun for publish
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # npm publishes, because bun publish has no trusted publishing, and
      # trusted publishing needs npm 11.5.1 or later, which Node 24 bundles
      - name: Set up node for publish
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # a version npm holds already is skipped, so a re-run after a failed
      # step publishes nothing twice
      - name: Publish @atcx/contract
        run: |
          bun install --frozen-lockfile
          bash scripts/publish-contract.sh

  # The run at the tag checks and ships it. A dispatch is the one GITHUB_TOKEN
  # event that starts a workflow.
  dispatch-release:
    needs: [release, pick-release-ship]
    if: ${{ !cancelled() && needs.pick-release-ship.outputs.ship == 'dispatch' }}
    concurrency:
      group: main-dispatch-release
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the ship run at the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh workflow run main.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"

  # GitHub marks each new release as latest, and install.sh downloads the
  # latest one. A release branch's release takes the mark too, and its
  # workflow runs this job in the same group, so the last run reads the final
  # state. GitHub keeps one pending run per group, and a run that replaces a
  # pending one reads the same state later, so one group serves every branch.
  latest-release:
    needs: [ship-release]
    if: ${{ !cancelled() && needs.ship-release.result != 'skipped' }}
    concurrency:
      group: atc-latest-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep the newest release as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/restore-latest-release.sh "$GITHUB_REPOSITORY"
