name: Main

on:
  push:
    branches: [main]
  # Recovery path for a release that tagged but failed to ship: skips the
  # release-please steps and re-runs only the steps that ship the current
  # version. Each of them replaces what a failed run left, so re-running is safe.
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: main-checks
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEFTHOOK: 0
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Audit Dependencies
        run: bun run audit

      - name: Dead Code
        run: bun run deadcode

      - name: Import Direction
        run: bun run check:imports

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint:full

      - name: Typecheck
        run: bun run typecheck

  # the suite runs in two shards, balanced by the committed per-file timings
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      LEFTHOOK: 0
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test --shard=${{ matrix.shard }}/2

  # the one status the main ruleset requires: it runs even when a job it needs
  # failed or was skipped, and passes only when every one of them succeeded
  checks:
    needs: [static, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "a required job ended as $result" >&2
              exit 1
            fi
          done

  binaries:
    uses: ./.github/workflows/binaries.yml

  release:
    needs: [checks, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # bun install's prepare script installs git hooks that re-run the
      # checks job's commands and would reject this job's bot pushes.
      LEFTHOOK: '0'
    steps:
      # A release takes two runs of this job:
      # - Run 1, after a releasable commit lands on main: release-please
      #   opens or updates the release PR (version bump + changelog), the
      #   sync step makes that PR pass the checks job, and auto-merge merges
      #   it.
      # - Run 2, triggered by that merge: release-please turns the merged
      #   bump into a tag + GitHub release, and the steps after it attach the
      #   binaries, update the Homebrew formula and open the cloud pin PR.
      #
      # The App token exists because GITHUB_TOKEN events don't trigger
      # workflows — a GITHUB_TOKEN merge of the release PR would never start
      # run 2. With no App configured (see docs/runbooks/releasing.md), release PRs are
      # left open to merge by hand and the chain continues from there.
      - name: Mint GitHub App token
        id: app-token
        if: github.event_name == 'push' && vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      # The release PR bumps the package.json version that bun.lock also
      # records, and generates files oxfmt wouldn't accept — repair both so
      # the PR passes the same checks as any other. The branch name is
      # deterministic: single manifest package with a component, so
      # release-please appends the component to its usual branch.
      - name: Check out release PR
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: release-please--branches--main--components--@zgeoff/atc
          token: ${{ steps.app-token.outputs.token || github.token }}
      - name: Set up bun
        if: steps.release.outputs.prs_created == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Sync lockfile and formatting on release PR
        if: steps.release.outputs.prs_created == 'true'
        run: |
          bun install
          bun run format
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: sync lockfile and format release files"
            git push
          fi

      # Reads no release-please outputs on purpose: prs_created is false
      # when the open release PR needed no update (a previous run failed
      # after creating it), and a step's env block is template-evaluated
      # even when its if-condition is false, so fallible expressions like
      # fromJSON must never appear in env. Mergeability is recomputed
      # asynchronously after the sync push — poll until it settles — and a
      # MERGEABLE read can be stale ("Base branch was modified" from the
      # merge mutation), so the merge attempt itself retries inside the
      # same loop rather than trusting any single read. The release app is a
      # bypass actor on the main ruleset, and --admin merges through that
      # bypass past the required review; without it, gh refuses any PR that
      # GitHub reports as blocked.
      - name: Auto-merge release PRs
        if: github.event_name == 'push' && steps.app-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          for pr in $(gh pr list --repo "$GITHUB_REPOSITORY" --head "release-please--branches--main--components--@zgeoff/atc" --json number --jq '.[].number'); do
            merged=''
            for _ in $(seq 1 12); do
              state=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json mergeable --jq .mergeable)
              if [ "$state" = "CONFLICTING" ]; then
                echo "release PR #$pr has conflicts" >&2
                exit 1
              fi
              if [ "$state" = "MERGEABLE" ] && gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --admin; then
                merged=1
                break
              fi
              sleep 5
            done
            if [ -z "$merged" ]; then
              echo "release PR #$pr never became mergeable" >&2
              exit 1
            fi
          done

      - name: Check out merged release
        if:
          steps.release.outputs.releases_created == 'true' || github.event_name ==
          'workflow_dispatch'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download binaries
        if:
          steps.release.outputs.releases_created == 'true' || github.event_name ==
          'workflow_dispatch'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: dist
      # --clobber makes a re-run replace assets a failed run left behind.
      - name: Attach binaries to the release
        if:
          steps.release.outputs.releases_created == 'true' || github.event_name ==
          'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version package.json)
          gh release upload "@zgeoff/atc@$version" dist/atc-* dist/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

      # The tap is a second repository, so the release App has to be
      # installed on it as well and HOMEBREW_TAP set to its name (see
      # docs/runbooks/releasing.md). With either missing, the formula is left alone.
      - name: Mint tap token
        id: tap-token
        if:
          (steps.release.outputs.releases_created == 'true' || github.event_name ==
          'workflow_dispatch') && vars.RELEASE_APP_ID != '' && vars.HOMEBREW_TAP != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.HOMEBREW_TAP }}
      - name: Update the Homebrew formula
        if: steps.tap-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          TAP: ${{ github.repository_owner }}/${{ vars.HOMEBREW_TAP }}
        run: |
          version=$(jq -r .version package.json)
          git clone "https://x-access-token:$GH_TOKEN@github.com/$TAP.git" tap
          mkdir -p tap/Formula
          scripts/build-formula.sh "$version" dist/SHA256SUMS > tap/Formula/atc.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/atc.rb
          git commit -m "atc $version" || echo "formula already at $version"
          git push

      # zgeoff/cloud's agent image bakes in atc, so each release opens or updates one pull request
      # there that pins the new version and its atc-linux-x64 sum. cloud's
      # scripts/open-atc-pin-pr.sh does the work, and cloud's agent image workflow turns on
      # auto-merge once the image builds and passes its check. The release App has to be installed
      # on cloud; this token reaches that repository only.
      - name: Mint cloud token
        id: cloud-token
        if:
          (steps.release.outputs.releases_created == 'true' || github.event_name ==
          'workflow_dispatch') && vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: cloud
      - name: Open the agent image pin pull request in cloud
        if: steps.cloud-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.cloud-token.outputs.token }}
          CLOUD: ${{ github.repository_owner }}/cloud
        run: |
          version=$(jq -r .version package.json)
          git clone "https://x-access-token:$GH_TOKEN@github.com/$CLOUD.git" cloud
          cd cloud
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/open-atc-pin-pr.sh "$version" ../dist/SHA256SUMS
