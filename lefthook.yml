# Git hooks. pre-commit fixes staged files only (fast); pre-push checks what
# the branch changes, plus the cheap whole-tree gates. CI runs every
# whole-tree check: type-aware lint (lint:full), dead code, and the full test suite.

pre-commit:
  piped: true
  jobs:
    - name: oxlint --fix
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}'
      run: node_modules/.bin/oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc,md,css,yml,yaml,html}'
      run: node_modules/.bin/oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: format-codemod
      glob: '*.{ts,tsx}'
      run: node_modules/.bin/format-codemod --quiet {staged_files}
      stage_fixed: true
    # after the fixers, so it checks what they wrote; skipped when no staged
    # file matches the glob
    - name: typecheck
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc}'
      run: bun run typecheck
    # last so it scans what the fixers above re-staged; needs the gitleaks
    # binary on PATH (mise: `mise use -g gitleaks`)
    - name: gitleaks
      run: gitleaks git --pre-commit --staged --redact --no-banner

commit-msg:
  jobs:
    - name: commitlint
      run: node_modules/.bin/commitlint --edit {1}

pre-push:
  # Sequential, to bound memory on a small host, and so each check's skip
  # condition reads the mark the first job writes.
  piped: true
  jobs:
    # A push that only deletes branches carries no content, so every check
    # after this job skips on the mark it writes. lefthook runs a job and a
    # skip condition each through sh -c, so $PPID in both is lefthook's own
    # pid, and each run's mark is a file named for its pid, which a
    # concurrent push in this worktree never writes.
    - name: read push refs
      use_stdin: true
      run: bun scripts/write-delete-only-push-mark.ts "$PPID"
    - name: format:check
      skip: &delete-only-push
        - run: test -f "$(git rev-parse --git-path atc-delete-only-push)/$PPID"
      run: bun run format:check
    - name: lint:shell
      skip: *delete-only-push
      run: bun run lint:shell
    - name: check:guest-scripts
      skip: *delete-only-push
      run: bun run check:guest-scripts
    - name: check:imports
      skip: *delete-only-push
      run: bun run check:imports
    - name: check:manifests
      skip: *delete-only-push
      run: bun run check:manifests
    - name: check:disable-baseline
      skip: *delete-only-push
      run: bun run check:disable-baseline
    - name: check:raw-escapes
      skip: *delete-only-push
      run: bun run check:raw-escapes
    - name: check:source-entries
      skip: *delete-only-push
      run: bun run check:source-entries
    - name: lint:mods
      skip: *delete-only-push
      run: bun run lint:mods
    - name: lint
      skip: *delete-only-push
      files: bun run --silent files:branch
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}'
      run: bun run lint:files {files}
    - name: typecheck
      skip: *delete-only-push
      run: bun run typecheck
    # leaves out the tests in scripts/pre-push-test-skips.json, which fail on
    # a developer host and pass in CI; CI runs them all. bun test ignores
    # mods/, whose tests run through test:atc-bridge, so they stay out too
    - name: test
      skip: *delete-only-push
      files: bun run --silent files:branch
      glob: '*.ts'
      exclude:
        - 'mods/**'
      run: bun run test:related {files}
