# Git hooks. The pre-push baseline from @zgeoff/chex checks what the branch
# changes, plus format:check and typecheck over the whole tree, each under
# the memory cap; it also runs typecheck after the pre-commit jobs below. The
# jobs here run before the baseline's. CI runs every whole-tree check:
# type-aware lint, dead code, the full test suite, and the e2e lane.
extends:
  - node_modules/@zgeoff/chex/lefthook.yml

pre-commit:
  piped: true
  jobs:
    - name: chex-baseline
      files: echo package.json
      run: |
        if [ ! -f node_modules/@zgeoff/chex/lefthook.yml ]; then
          echo "chex-baseline: node_modules/@zgeoff/chex/lefthook.yml is missing, so lefthook runs none of the chex baseline's jobs; run bun install, then try again"
          exit 1
        fi
        # {files}
    - name: oxlint --fix
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}'
      run: node_modules/.bin/oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc,md,css,yml,yaml,html}'
      run: node_modules/.bin/oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    # the exclude mirrors .formatignore: the tool exits 2 when every file
    # it is given is ignored, so ignored files must not reach it
    - name: format-codemod
      glob: '*.{ts,tsx}'
      exclude:
        - '**/dist/**'
        - 'dist/**'
        - '**/coverage/**'
        - 'coverage/**'
        - '.worktrees/**'
        - '.claude/**'
      run: node_modules/.bin/format-codemod --quiet {staged_files}
      stage_fixed: true
    # last so it scans what the fixers above re-staged; needs the gitleaks
    # binary on PATH (mise: `mise use -g gitleaks`)
    - name: gitleaks
      run: gitleaks git --pre-commit --staged --redact --no-banner

commit-msg:
  jobs:
    - name: commitlint
      run: node_modules/.bin/commitlint --edit {1}

pre-push:
  # Sequential, to bound memory on a small host, and so each check's skip
  # condition reads the mark the first job writes.
  piped: true
  exclude_tags:
    - chex-test
  jobs:
    - name: chex-baseline
      files: echo package.json
      run: |
        if [ ! -f node_modules/@zgeoff/chex/lefthook.yml ]; then
          echo "chex-baseline: node_modules/@zgeoff/chex/lefthook.yml is missing, so lefthook runs none of the chex baseline's jobs; run bun install, then try again"
          exit 1
        fi
        # {files}
    # A push that only deletes branches carries no content, so every atc check
    # after this job skips on the mark it writes. lefthook runs a job and a
    # skip condition each through sh -c, so $PPID in both is lefthook's own
    # pid, and each run's mark is a file named for its pid, which a
    # concurrent push in this worktree never writes.
    - name: read push refs
      use_stdin: true
      # git exports GIT_EXEC_PATH to each hook it runs. A hook run by hand
      # lacks it, and lefthook would wait on the terminal for this job's stdin.
      skip:
        - run: test -z "$GIT_EXEC_PATH"
      run: bun scripts/write-delete-only-push-mark.ts "$PPID"
    - name: check:guest-scripts
      skip: &delete-only-push
        - run: test -f "$(git rev-parse --git-path atc-delete-only-push)/$PPID"
      run: bun x --no-install diet -- bun run check:guest-scripts
    - name: check:imports
      skip: *delete-only-push
      run: bun x --no-install diet -- bun run check:imports
    - name: check:manifests
      skip: *delete-only-push
      run: bun x --no-install diet -- bun run check:manifests
    - name: check:disable-baseline
      skip: *delete-only-push
      run: bun x --no-install diet -- bun run check:disable-baseline
    - name: check:raw-escapes
      skip: *delete-only-push
      run: bun x --no-install diet -- bun run check:raw-escapes
    - name: check:source-entries
      skip: *delete-only-push
      run: bun x --no-install diet -- bun run check:source-entries
    - name: lint:mods
      skip: *delete-only-push
      run: bun x --no-install diet -- bun run lint:mods
    # The baseline's chex-test job runs rig related outside the test home, so
    # exclude_tags drops it and this job runs test:related, which sets the
    # home up first. bun test ignores mods/, whose tests run through
    # test:atc-bridge, and fails a run whose every path it ignores.
    - name: test
      skip: *delete-only-push
      files:
        unset $(git rev-parse --local-env-vars); bun
        node_modules/@zgeoff/chex/src/read-branch-files.ts
      glob: '*.{ts,tsx,toml}'
      exclude:
        - 'mods/**'
      run: '{clear-git-env} bun x --no-install diet -- bun run test:related {files}'
    # A later hook run by hand skips the mark job, so a mark left under a pid
    # that it reuses would skip its checks.
    - name: remove push mark
      run: rm -f "$(git rev-parse --git-path atc-delete-only-push)/$PPID"
